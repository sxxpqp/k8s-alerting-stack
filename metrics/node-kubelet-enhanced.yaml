# Kubelet 增强采集：补充默认 kubelet ServiceMonitor 之外的指标。
# 用途：采集 kubelet cAdvisor 细粒度指标、Probe 指标、Pod 启动延迟等。
# 默认 kubelet 采集 (/metrics, /metrics/cadvisor) 仍生效，本配置叠加补充指标。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-kubelet-enhanced
  namespace: monitoring
  labels:
    release: kps
    app: kube-prometheus-stack
    purpose: node-enhanced
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: kubelet
  endpoints:
    # 补充：kubelet probe 指标（liveness/readiness/startup 探测延迟）
    - port: https-metrics
      scheme: https
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics/probes
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - targetLabel: env
          replacement: production
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: '^prober_probe_.*'
          action: keep
    # 补充：Pod 资源指标（完整 cAdvisor 视角）
    - port: https-metrics
      scheme: https
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics/cadvisor
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - targetLabel: env
          replacement: production
      metricRelabelings:
        # 只保留容器相关指标，丢弃 cgroup 根级指标减少体量
        - sourceLabels: [container]
          regex: '^$'
          action: drop