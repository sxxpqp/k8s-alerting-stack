# 候选 Prometheus rule groups，不是可直接 apply 的 Kubernetes 资源。
# 先验证指标包含真实业务 namespace；确认后合并进原完整 PrometheusRule。
# 保持现有 5% / rate 2m / for 5m；未擅自增加最低请求量阈值。
groups:
  - name: ingress-nginx
    rules:
      - alert: IngressNginx5xxRateHigh
        expr: |
          (
            sum by (namespace, ingress) (
              rate(nginx_ingress_controller_requests{status=~"5..",ingress!=""}[2m])
            )
            /
            sum by (namespace, ingress) (
              rate(nginx_ingress_controller_requests{ingress!=""}[2m])
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Ingress {{ $labels.namespace }}/{{ $labels.ingress }} 5xx 比例过高'
          description: '最近 2 分钟的 5xx 比例为 {{ $value | humanizePercentage }}，连续超过 5% 达 5 分钟。'
          value: '{{ $value | humanizePercentage }}'
          threshold: '5%'
