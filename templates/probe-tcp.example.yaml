# 只有安装并确认 tcp_connect 模块后才启用；TCP 成功指标使用 probe_success。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-tcp
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k8s-alerting-stack
spec:
  jobName: blackbox-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  prober:
    path: /probe
    url: blackbox-exporter:19115
  targets:
    staticConfig:
      labels:
        cluster: REPLACE_WITH_CLUSTER_NAME
        env: REPLACE_WITH_ENV_NAME
        type: tcp-service
      static:
        - REPLACE_WITH_HOST:REPLACE_WITH_PORT
