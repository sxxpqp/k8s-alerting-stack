# 新环境参考模板；替换 cluster / env / targets 后，经 dry-run 与确认再安装。
# 不代表已经在当前集群部署；不要用示例目标替换现网 50 个目标。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-http-external
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k8s-alerting-stack
spec:
  jobName: blackbox-http-external
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    path: /probe
    # kube-prometheus v0.14.0 的探测端口；9115 是 TLS/RBAC 代理端口。
    url: blackbox-exporter:19115
  targets:
    staticConfig:
      labels:
        cluster: REPLACE_WITH_CLUSTER_NAME
        env: REPLACE_WITH_ENV_NAME
        type: external-service
      static:
        - https://example.com/health
