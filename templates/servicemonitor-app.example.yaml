# 新环境业务 Service 的参考，不安装业务服务；labels 与端口名须和实际 Service 对应。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: REPLACE_WITH_APP_NAME
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - REPLACE_WITH_APP_NAMESPACE
  selector:
    matchLabels:
      app: REPLACE_WITH_SERVICE_LABEL_VALUE
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
