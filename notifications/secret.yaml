# =============================================================================
# PrometheusAlert → 企业微信 Webhook 地址
# =============================================================================
# 字段说明：
#   type=wx           → 企业微信群机器人 Webhook（不是 workwechat 应用 API）
#   tpl=prometheus-wx → 使用的模板名，对应 PrometheusAlert Web UI 里的模板
#   wxurl=...         → 企业微信 Webhook URL，必须 URL 编码！
#
# wxurl 编码方式：
#   原始地址：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key
#   编码命令：node -e "console.log(encodeURIComponent('原始地址'))"
#   编码结果：https%3A%2F%2Fqyapi.weixin.qq.com%2Fcgi-bin%2Fwebhook%2Fsend%3Fkey%3D你的key
#
# 为什么必须编码：如果不编码，企业微信地址里的 ?key= 会被当成 PrometheusAlert 的参数，
# 导致 Webhook 地址解析错误。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: prometheusalert-webhooks
  namespace: monitoring
type: Opaque
stringData:
  workwechat-url: 'http://prometheusalert.monitoring.svc:8080/prometheusalert?type=wx&tpl=prometheus-wx&wxurl=https://xxx'