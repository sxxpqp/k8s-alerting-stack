# 参数结构草案，不是 Kubernetes 资源，也不是已经实现的生成器输入。
# 在实际 selectors / 路由 / 模板持久化核实后冻结结构。
environment:
  name: REPLACE_WITH_UNIQUE_CLUSTER_NAME
  mode: fresh # fresh 或 existing，执行流程不同
  namespace: monitoring
  kubernetesVersion: REPLACE_WITH_TARGET_VERSION
storage:
  storageClass: REPLACE_WITH_EXISTING_STORAGE_CLASS
  prometheusCapacity: REPLACE_WITH_CAPACITY
  prometheusRetention: REPLACE_WITH_RETENTION
  alertmanagerCapacity: REPLACE_WITH_CAPACITY
  alertCenterCapacity: REPLACE_WITH_CAPACITY
access:
  mode: REPLACE_WITH_CLUSTERIP_NODEPORT_OR_INGRESS
  prometheusUrl: REPLACE_WITH_REACHABLE_URL
  alertmanagerUrl: REPLACE_WITH_REACHABLE_URL
  alertCenterUrl: REPLACE_WITH_REACHABLE_URL
notifications:
  dingtalk:
    enabled: true
    credentialsSecret: REPLACE_WITH_LOCAL_SECRET_REFERENCE
  wecomRobot:
    enabled: true
    credentialsSecret: REPLACE_WITH_LOCAL_SECRET_REFERENCE
rules:
  ingress: false # 先确认存在 ingress-nginx 指标再启用
  databases: false # 按实际部署和 exporter 分别选择
