# 只允许 monitoring namespace 内的 Pod 访问 PrometheusAlert HTTP 端口。
# 这不是同 namespace 的 Pod 隔离；上线前仍要限制该 namespace 的写权限。
# 如果 Alertmanager 位于其他 namespace，先按实际来源修改，不可直接应用。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheusalert-ingress
spec:
  podSelector:
    matchLabels:
      app: prometheusalert
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
