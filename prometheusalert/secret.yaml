apiVersion: v1
kind: Secret
metadata:
  name: prometheusalert-config
  namespace: monitoring
type: Opaque
stringData:
  app.conf: |
    appname = PrometheusAlert
    runmode = prod
    httpaddr = 0.0.0.0
    httpport = 8080
    copyrequestbody = true
    login_user = admin
    login_password = prometheusalert
    logtype = console
    title = PrometheusAlert
    db_driver = sqlite3
    db_path = /app/data/prometheusalert.db
    open-dingding = 0
    open-feishu = 0
    open-weixin = 1
    open-workwechat = 1
    wxurl =
    dd_isatall = 0
    open-dingding-secret = 0
    open-alertgroup = 0
    AlertRecord = 0
    RecordLive = 0
    alert_to_es = 0
    open-txdx = 0
    open-txdh = 0
    open-hwdx = 0
    open-alydx = 0
    open-alydh = 0
    open-rlydh = 0
    open-email = 0
    open-7moordx = 0
    open-7moordh = 0
    open-tg = 0
    open-baidudx = 0
    open-ruliu = 0
    open-bark = 0
    open-voice = 0
    open-feishuapp = 0
    open-kafka = 0