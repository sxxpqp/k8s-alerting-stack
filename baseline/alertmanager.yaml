# 用户 2026-11-04 提供的现网配置，已移除机器人凭据与人员信息。
# 仅供比对；占位凭据不可发送消息，不要直接覆盖现网。
global:
  resolve_timeout: 3m
route:
  group_by: ['instance', 'namespace']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: web.hook.prometheusalert
  routes:
    - receiver: Watchdog
      matchers:
        - alertname="Watchdog"
    - receiver: 'null'
      matchers:
        - alertname="InfoInhibitor"
    - receiver: web.hook.prometheusalert
      matchers:
        - severity="critical"
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: [namespace, alertname]
  - source_matchers:
      - severity="warning"
    target_matchers:
      - severity="info"
    equal: [namespace, alertname]
  - source_matchers:
      - alertname="InfoInhibitor"
    target_matchers:
      - severity="info"
    equal: [namespace]
receivers:
  - name: Default
  - name: Watchdog
  - name: Critical
  - name: 'null'
  - name: web.hook.prometheusalert
    webhook_configs:
      - url: 'http://prometheus-alert-center:8080/prometheusalert?type=wx&tpl=prometheus-wx&wxurl=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REDACTED&at=REDACTED'
