# Chart 92.18.0 的新环境示例；复制到 .local/kps-values.yaml 后编辑。
# 容量/资源为示例，不是按当前业务估算的生产推荐值。不能覆盖旧安装。
grafana:
  enabled: false # 复用已有Grafana；新环境需要时另配其存储、账号和入口。

defaultRules:
  create: true
  additionalRuleLabels:
    team: platform
  rules:
    # 这些上游组含1d/3d等长窗口，不能在本地6h保留中有效评估。
    # 关闭本地版本后需在 Mimir Ruler 单独维护；不关闭其余基础规则。
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverSlos: false

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 6h
    replicaExternalLabelName: __replica__
    externalLabels:
      cluster: REPLACE_CLUSTER
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: REPLACE_STORAGE_CLASS
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        release: kps
    ruleNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kps
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels:
        release: kps
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector:
      matchLabels:
        release: kps
    probeNamespaceSelector: {}
    # 新采集只走metrics目录的CRD，不再在values中堆additionalScrapeConfigs。
    remoteWrite:
      - url: https://REPLACE_MIMIR_HOST/api/v1/push
        headers:
          X-Scope-OrgID: REPLACE_TENANT
        basicAuth:
          username:
            name: mimir-remote-write
            key: username
          password:
            name: mimir-remote-write
            key: password

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: [cluster, namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - receiver: 'null'
          matchers: ['severity="info"']
        - receiver: 'null'
          matchers: ['alertname="Watchdog"']
        - receiver: 'null'
          matchers: ['alertname="InfoInhibitor"']
    receivers:
      - name: 'null'
  alertmanagerSpec:
    replicas: 3
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: REPLACE_STORAGE_CLASS
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    alertmanagerConfigSelector:
      matchLabels:
        release: kps
        alert-routing: prometheusalert
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    # 在受信任的monitoring命名空间集中管理路由，接收其他业务namespace告警。
    # 不允许任意业务命名空间创建匹配此selector的路由。
    alertmanagerConfigMatcherStrategy:
      type: None
